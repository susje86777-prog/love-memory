<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ff6b81">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Love Memory">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<title>💕 Love Memory</title>
<style>
/* ══════════════════════════════════════════════════════════════
   CSS 自定义属性 (主题系统)
   ══════════════════════════════════════════════════════════════ */
:root {
  --primary: #ff6b81;
  --primary-dark: #ee5a6f;
  --secondary: #ffb8c6;
  --accent: #ff4757;
  --bg: #0a0a12;
  --bg-card: rgba(255,255,255,0.08);
  --bg-card-hover: rgba(255,255,255,0.14);
  --glass: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.12);
  --text: #f0e6e8;
  --text-secondary: #b8a0a8;
  --text-muted: #7a6670;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
  --shadow-lg: 0 16px 48px rgba(0,0,0,0.5);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 8px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

[data-theme="blush"] {
  --primary: #f8a4c8;
  --primary-dark: #e893b6;
  --secondary: #fcd5e4;
  --accent: #e8879e;
  --bg: #1a0a14;
}

[data-theme="lavender"] {
  --primary: #b8a9c9;
  --primary-dark: #a695ba;
  --secondary: #d4c5e2;
  --accent: #9b7db5;
  --bg: #0f0c1a;
}

[data-theme="sunset"] {
  --primary: #ff9a76;
  --primary-dark: #f08a65;
  --secondary: #ffc3a0;
  --accent: #ff6f3c;
  --bg: #1a0e08;
}

/* ══════════════════════════════════════════════════════════════
   CSS 重置 & 基础样式
   ══════════════════════════════════════════════════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

body {
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  transition: background 0.8s ease;
}

input, textarea, button, select {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  border: none;
  outline: none;
  background: none;
}

button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
input[type="file"] { display: none; }
a { color: var(--primary); text-decoration: none; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }

/* ══════════════════════════════════════════════════════════════
   爱心Canvas & 背景层
   ══════════════════════════════════════════════════════════════ */
#heartsCanvas {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 1;
}

.bg-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(ellipse at 50% 0%, rgba(255,107,129,0.08) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 80%, rgba(180,130,200,0.06) 0%, transparent 50%);
  pointer-events: none; z-index: 0;
}

/* ══════════════════════════════════════════════════════════════
   密码锁屏
   ══════════════════════════════════════════════════════════════ */
.lock-screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  background-size: cover;
  background-position: center;
  transition: opacity 0.5s ease, transform 0.5s ease;
}

.lock-screen.hidden {
  opacity: 0; transform: scale(1.05); pointer-events: none;
}

.lock-card {
  text-align: center;
  padding: 40px 30px;
  border-radius: 24px;
  background: rgba(20, 15, 30, 0.92);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-lg);
  max-width: 380px; width: 90%;
  animation: lockIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes lockIn {
  from { opacity: 0; transform: translateY(40px) scale(0.9); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.lock-icon {
  font-size: 56px;
  margin-bottom: 12px;
  animation: heartbeat 1.5s ease-in-out infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.25); }
  30% { transform: scale(1); }
  45% { transform: scale(1.2); }
  60% { transform: scale(1); }
}

.lock-title {
  font-size: 24px; font-weight: 700;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
  letter-spacing: 2px;
}

.lock-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 28px; letter-spacing: 1px; }

.pin-display {
  display: flex; justify-content: center; gap: 14px; margin-bottom: 28px;
}

.pin-dot {
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 2px solid var(--glass-border);
  background: transparent;
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.pin-dot.filled {
  background: var(--primary);
  border-color: var(--primary);
  box-shadow: 0 0 16px rgba(255,107,129,0.5);
  transform: scale(1.2);
}

.pin-dot.error {
  background: #ff4757; border-color: #ff4757;
  animation: shake 0.5s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(4px); }
}

.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 280px; margin: 0 auto; }

.keypad button {
  width: 70px; height: 70px;
  border-radius: 50%;
  font-size: 22px;
  font-weight: 600;
  color: var(--text);
  background: rgba(255,255,255,0.08);
  border: 2px solid var(--glass-border);
  display: flex; align-items: center; justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: rgba(255,255,255,0);
  user-select: none;
  -webkit-user-select: none;
  margin: 0 auto;
  cursor: pointer;
}

.keypad button:active {
  background: var(--primary) !important;
  border-color: var(--primary) !important;
  color: #fff;
}

.keypad .key-clear { font-size: 14px; color: var(--text-secondary); }
.keypad .key-ok { font-size: 14px; color: var(--primary); font-weight: 700; background: rgba(255,107,129,0.15); }

.lock-error { color: #ff4757; font-size: 12px; margin-top: 16px; min-height: 18px; letter-spacing: 1px; }
.lock-footer { margin-top: 20px; }

.lock-footer a {
  font-size: 11px; color: var(--text-muted);
  cursor: pointer; text-decoration: underline;
  opacity: 0.5; transition: opacity 0.2s;
}

.lock-footer a:hover { opacity: 1; }

.install-hint {
  margin-top: 20px; padding: 14px;
  background: rgba(255,255,255,0.04);
  border-radius: 14px;
  border: 1px dashed rgba(255,255,255,0.15);
}

.install-hint-text { font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; letter-spacing: 1px; }

.btn-install {
  display: block; width: 100%;
  padding: 14px 20px;
  border-radius: 25px;
  font-size: 15px; font-weight: 700; letter-spacing: 1px;
  background: linear-gradient(135deg, #4CAF50, #45a049);
  color: #fff;
  box-shadow: 0 4px 16px rgba(76,175,80,0.3);
  animation: pulseInstall 2s ease-in-out infinite;
  transition: all 0.3s;
}

.btn-install:active { transform: scale(0.95); }

@keyframes pulseInstall {
  0%, 100% { box-shadow: 0 4px 16px rgba(76,175,80,0.3); }
  50% { box-shadow: 0 4px 30px rgba(76,175,80,0.6); }
}

.install-manual { margin-top: 10px; }
.install-manual details { color: var(--text-muted); font-size: 11px; cursor: pointer; }
.install-manual summary { letter-spacing: 1px; padding: 4px 0; }
.install-steps { padding: 8px 0; line-height: 1.8; }
.install-steps p { margin: 4px 0; font-size: 11px; color: var(--text-secondary); }
.install-steps b { color: var(--primary); }

/* ══════════════════════════════════════════════════════════════
   应用主容器
   ══════════════════════════════════════════════════════════════ */
.app-container {
  position: relative; width: 100%; height: 100%;
  display: flex; flex-direction: column;
  z-index: 10;
}

/* ══════════════════════════════════════════════════════════════
   Tab导航栏
   ══════════════════════════════════════════════════════════════ */
.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 72px;
  display: flex; align-items: center; justify-content: space-around;
  background: rgba(10,10,18,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--glass-border);
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

.tab-btn {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 16px;
  border-radius: 12px;
  color: var(--text-muted);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 1px;
  transition: all 0.25s ease;
  min-width: 56px;
}

.tab-btn .tab-icon { font-size: 22px; transition: transform 0.25s ease; }
.tab-btn.active { color: var(--primary); }
.tab-btn.active .tab-icon { transform: translateY(-2px); }
.tab-btn:active .tab-icon { transform: scale(0.85); }

/* ══════════════════════════════════════════════════════════════
   视图容器
   ══════════════════════════════════════════════════════════════ */
.view {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  overflow-y: auto; overflow-x: hidden;
  padding: 20px 16px 100px;
  display: none;
  animation: viewIn 0.35s ease;
  -webkit-overflow-scrolling: touch;
}

.view.active { display: block; }

@keyframes viewIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ══════════════════════════════════════════════════════════════
   纪念日横幅
   ══════════════════════════════════════════════════════════════ */
.anniversary-banner {
  text-align: center; padding: 24px 20px;
  margin-bottom: 20px; border-radius: 20px;
  background: linear-gradient(135deg, rgba(255,107,129,0.15), rgba(255,184,198,0.08));
  border: 1px solid rgba(255,107,129,0.2);
  backdrop-filter: blur(10px);
}

.anniversary-banner .days-count {
  font-size: 48px; font-weight: 800;
  background: linear-gradient(135deg, #ff6b81, #ffb8c6, #ff6b81);
  background-size: 200% auto;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 3s ease-in-out infinite;
}

@keyframes shimmer {
  0%, 100% { background-position: 0% center; }
  50% { background-position: 200% center; }
}

.anniversary-banner .days-label { font-size: 14px; color: var(--text-secondary); letter-spacing: 2px; margin-top: 4px; }
.anniversary-banner .next-milestone { font-size: 12px; color: var(--text-muted); margin-top: 8px; }

/* ══════════════════════════════════════════════════════════════
   时间轴卡片
   ══════════════════════════════════════════════════════════════ */
.timeline { position: relative; }

.timeline::before {
  content: ''; position: absolute; left: 20px; top: 0; bottom: 0;
  width: 2px; background: linear-gradient(180deg, var(--primary), transparent);
  opacity: 0.4;
}

.memory-card {
  position: relative;
  margin-left: 40px; margin-bottom: 16px;
  padding: 16px; border-radius: var(--radius);
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border);
  cursor: pointer;
  transition: all 0.25s ease;
  animation: cardIn 0.4s ease both;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateX(-20px); }
  to { opacity: 1; transform: translateX(0); }
}

.memory-card:hover { background: var(--bg-card-hover); transform: translateX(4px); }
.memory-card:active { transform: scale(0.98); }

.memory-card::before {
  content: ''; position: absolute; left: -32px; top: 24px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--primary);
  box-shadow: 0 0 10px var(--primary);
}

.memory-card .card-date {
  font-size: 11px; color: var(--primary); letter-spacing: 2px;
  margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}

.memory-card .card-thumb {
  width: 100%; max-height: 240px; object-fit: cover;
  border-radius: var(--radius-sm); margin-bottom: 10px;
  background: var(--glass);
}

.memory-card .card-title {
  font-size: 16px; font-weight: 600; color: var(--text);
  margin-bottom: 4px; line-height: 1.4;
}

.memory-card .card-preview {
  font-size: 13px; color: var(--text-secondary);
  line-height: 1.5; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

.card-type-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; padding: 3px 8px; border-radius: 20px;
  background: rgba(255,107,129,0.15); color: var(--primary);
  letter-spacing: 1px;
}

.empty-state {
  text-align: center; padding: 60px 20px;
  color: var(--text-muted);
}

.empty-state .empty-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.6; }
.empty-state .empty-text { font-size: 15px; letter-spacing: 1px; }
.empty-state .empty-hint { font-size: 12px; margin-top: 8px; opacity: 0.6; }

/* ══════════════════════════════════════════════════════════════
   添加记忆视图
   ══════════════════════════════════════════════════════════════ */
.add-header {
  text-align: center; margin-bottom: 24px;
}

.add-header h2 {
  font-size: 22px; font-weight: 700; letter-spacing: 2px;
  margin-bottom: 16px;
}

.segment-control {
  display: flex; gap: 4px;
  background: var(--glass); border-radius: 24px;
  padding: 4px; max-width: 260px; margin: 0 auto;
  border: 1px solid var(--glass-border);
}

.segment-btn {
  flex: 1; padding: 10px 20px; border-radius: 20px;
  font-size: 13px; font-weight: 600; letter-spacing: 1px;
  color: var(--text-muted); transition: all 0.3s ease;
}

.segment-btn.active {
  background: var(--primary); color: #fff;
  box-shadow: 0 4px 16px rgba(255,107,129,0.3);
}

.upload-zone {
  border: 2px dashed var(--glass-border); border-radius: var(--radius);
  padding: 40px 20px; text-align: center;
  margin: 16px 0; transition: all 0.3s ease;
  background: var(--glass); cursor: pointer;
}

.upload-zone:hover, .upload-zone.drag-over {
  border-color: var(--primary);
  background: rgba(255,107,129,0.08);
}

.upload-zone .upload-icon { font-size: 48px; margin-bottom: 8px; }
.upload-zone .upload-text { font-size: 14px; color: var(--text-secondary); letter-spacing: 1px; }
.upload-zone .upload-hint { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

.preview-img {
  max-width: 100%; max-height: 240px; border-radius: var(--radius-sm);
  margin: 12px 0; display: block;
}

.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 12px; color: var(--text-secondary); letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase; }
.form-input, .form-textarea {
  width: 100%; padding: 14px 16px;
  border-radius: var(--radius-sm); background: var(--glass);
  border: 1px solid var(--glass-border); color: var(--text);
  font-size: 15px; transition: all 0.3s ease;
}

.form-input:focus, .form-textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,129,0.1); }
.form-textarea { min-height: 120px; resize: vertical; line-height: 1.6; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 28px; border-radius: 24px;
  font-size: 15px; font-weight: 600; letter-spacing: 1px;
  transition: all 0.3s ease; width: 100%;
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff; box-shadow: 0 4px 20px rgba(255,107,129,0.3);
}

.btn-primary:hover { box-shadow: 0 6px 24px rgba(255,107,129,0.45); transform: translateY(-1px); }
.btn-primary:active { transform: scale(0.97); }
.btn-primary:disabled { opacity: 0.5; pointer-events: none; }

.btn-danger {
  background: rgba(255,71,87,0.15); color: #ff4757;
  border: 1px solid rgba(255,71,87,0.3);
}

.btn-secondary {
  background: var(--glass); color: var(--text);
  border: 1px solid var(--glass-border);
}

/* ══════════════════════════════════════════════════════════════
   搜索栏
   ══════════════════════════════════════════════════════════════ */
.search-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; border-radius: 24px;
  background: var(--glass); border: 1px solid var(--glass-border);
  margin-bottom: 20px; transition: border-color 0.3s;
}

.search-bar:focus-within { border-color: var(--primary); }
.search-bar input { flex: 1; font-size: 14px; color: var(--text); }
.search-bar input::placeholder { color: var(--text-muted); }
.search-bar .search-icon { font-size: 18px; color: var(--text-muted); }

/* ══════════════════════════════════════════════════════════════
   设置视图
   ══════════════════════════════════════════════════════════════ */
.settings-section {
  margin-bottom: 24px;
  padding: 20px; border-radius: var(--radius);
  background: var(--bg-card); backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border);
}

.settings-section h3 {
  font-size: 15px; font-weight: 600; letter-spacing: 2px;
  margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
}

.preset-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
}

.preset-item {
  aspect-ratio: 1; border-radius: var(--radius-sm);
  cursor: pointer; border: 3px solid transparent;
  transition: all 0.3s ease; position: relative;
}

.preset-item:hover { transform: scale(1.05); }
.preset-item.selected { border-color: #fff; box-shadow: 0 0 20px rgba(255,255,255,0.3); }
.preset-item.selected::after {
  content: '✓'; position: absolute; top: 4px; right: 8px;
  color: #fff; font-size: 16px; font-weight: 700;
  text-shadow: 0 0 8px rgba(0,0,0,0.5);
}

.custom-bg-preview {
  width: 100%; height: 100px; border-radius: var(--radius-sm);
  background-size: cover; background-position: center; margin-bottom: 10px;
}

.settings-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; border-bottom: 1px solid var(--glass-border);
}

.settings-row:last-child { border-bottom: none; }
.settings-row .row-label { font-size: 14px; color: var(--text); }
.settings-row .row-value { font-size: 13px; color: var(--text-secondary); }

input[type="range"] {
  -webkit-appearance: none; width: 120px; height: 6px;
  border-radius: 3px; background: var(--glass-border); outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 22px; height: 22px;
  border-radius: 50%; background: var(--primary);
  cursor: pointer; box-shadow: 0 0 10px rgba(255,107,129,0.4);
}

/* 主题选择器 */
.theme-options {
  display: flex; gap: 10px;
}

.theme-dot {
  width: 32px; height: 32px; border-radius: 50%;
  cursor: pointer; border: 3px solid transparent; transition: all 0.3s;
}

.theme-dot:hover { transform: scale(1.15); }
.theme-dot.selected { border-color: #fff; box-shadow: 0 0 14px currentColor; }

/* ══════════════════════════════════════════════════════════════
   详情弹窗
   ══════════════════════════════════════════════════════════════ */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 200;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.25s ease;
  padding: 20px;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal-content {
  background: rgba(20,20,35,0.95);
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  max-width: 600px; width: 100%; max-height: 85vh;
  overflow-y: auto; padding: 24px;
  box-shadow: var(--shadow-lg);
  animation: modalIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.9) translateY(30px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-close {
  position: sticky; top: 0; float: right;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--glass); border: 1px solid var(--glass-border);
  font-size: 18px; display: flex; align-items: center; justify-content: center;
  color: var(--text); z-index: 1; transition: all 0.2s;
}

.modal-close:hover { background: rgba(255,71,87,0.2); border-color: #ff4757; }

.modal-img {
  width: 100%; border-radius: var(--radius-sm); margin-bottom: 16px;
  max-height: 50vh; object-fit: contain; background: var(--glass);
}

.modal-date { font-size: 12px; color: var(--primary); letter-spacing: 2px; margin-bottom: 8px; }
.modal-title { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
.modal-body { font-size: 15px; color: var(--text-secondary); line-height: 1.8; white-space: pre-wrap; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }

/* ══════════════════════════════════════════════════════════════
   Toast通知
   ══════════════════════════════════════════════════════════════ */
.toast-container {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
  z-index: 300; display: flex; flex-direction: column-reverse; gap: 8px;
}

.toast {
  padding: 12px 24px; border-radius: 24px;
  font-size: 13px; font-weight: 600; letter-spacing: 1px;
  white-space: nowrap;
  animation: toastIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: var(--shadow);
}

.toast.success { background: #2ed573; color: #fff; }
.toast.error { background: #ff4757; color: #fff; }
.toast.info { background: var(--primary); color: #fff; }

@keyframes toastIn {
  from { opacity: 0; transform: translateY(20px) scale(0.8); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ══════════════════════════════════════════════════════════════
   浮动音乐按钮
   ══════════════════════════════════════════════════════════════ */
.music-fab {
  position: fixed; top: 20px; right: 20px;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--glass); backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border);
  font-size: 20px; display: flex; align-items: center; justify-content: center;
  z-index: 90; transition: all 0.3s ease;
  box-shadow: var(--shadow);
}

.music-fab:hover { background: var(--bg-card-hover); }
.music-fab.playing { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 0 20px rgba(255,107,129,0.5); }

/* ══════════════════════════════════════════════════════════════
   爱心爆发动画 (CSS)
   ══════════════════════════════════════════════════════════════ */
.heart-burst {
  position: fixed; pointer-events: none; z-index: 250;
  font-size: 24px; animation: burstOut 1s ease-out forwards;
}

@keyframes burstOut {
  0% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
  100% { opacity: 0; transform: translate(var(--bx), var(--by)) scale(0) rotate(var(--br)); }
}

/* ══════════════════════════════════════════════════════════════

  if (!iso) return '';
  const d = new Date(iso);
  const weekdays = ['日','一','二','三','四','五','六'];
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  const w = weekdays[d.getDay()];
  return `${y}年${m}月${day}日 星期${w}`;
}

function formatDateShort(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

function daysBetween(d1, d2) {

async function hashPin(pin) {
  const encoder = new TextEncoder();
  const data = encoder.encode(pin);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2,'0')).join('');
}

// ── 加密核心 ──
// 从锁屏密码哈希派生 AES-GCM 密钥
async function getEncryptionKey() {
  const pwHash = localStorage.getItem('passwordHash');
  if (!pwHash) throw new Error('No password hash');
  const salt = getEncryptionSalt();
  // PBKDF2 派生 256-bit AES 密钥
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(pwHash), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: enc.encode(salt), iterations: 200000, hash: 'SHA-256' },
    keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}

function getEncryptionSalt() {
  let salt = localStorage.getItem('enc_salt');
  // 如果盐值不是从密码哈希派生的（旧版随机盐），重新生成
  const pwHash = localStorage.getItem('passwordHash') || 'default';
  const expectedSalt = pwHash.substring(0, 32);
  if (!salt || salt !== expectedSalt) {
    salt = expectedSalt;
    localStorage.setItem('enc_salt', salt);
    console.log('🔑 加密盐值已同步');
  }
  return salt;
}

// AES-GCM 加密 → 返回 { iv, ciphertext } (base64)
async function encryptData(plaintext) {
  const key = await getEncryptionKey();
  const iv = crypto.getRandomValues(new Uint8Array(12)); // 96-bit IV
  const enc = new TextEncoder();
  const ciphertext = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv }, key, enc.encode(plaintext)
  );
  return {
    iv: btoa(String.fromCharCode(...iv)),
    data: btoa(String.fromCharCode(...new Uint8Array(ciphertext)))
  };
}

// AES-GCM 解密
async function decryptData(ivB64, dataB64) {
  const key = await getEncryptionKey();
  const iv = Uint8Array.from(atob(ivB64), c => c.charCodeAt(0));
  const ciphertext = Uint8Array.from(atob(dataB64), c => c.charCodeAt(0));
  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv }, key, ciphertext
  );
  return new TextDecoder().decode(plain);
}

// 加密 Blob → 返回加密后的 base64 + iv
async function encryptBlob(blob) {
  const key = await getEncryptionKey();
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const arrayBuf = await blob.arrayBuffer();
  const ciphertext = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv }, key, arrayBuf
  );
  return {
    iv: btoa(String.fromCharCode(...iv)),
    data: btoa(String.fromCharCode(...new Uint8Array(ciphertext)))
  };
}

// 解密 base64 → Blob
async function decryptBlob(ivB64, dataB64, type = 'image/jpeg') {
  const key = await getEncryptionKey();
  const iv = Uint8Array.from(atob(ivB64), c => c.charCodeAt(0));
  const ciphertext = Uint8Array.from(atob(dataB64), c => c.charCodeAt(0));
  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv }, key, ciphertext
  );
  return new Blob([plain], { type });
}

async function syncFromCloud() {
  const token = getSyncToken();
  if (!token) return;
  const stats = { memories: 0, photos: 0, failed: 0 };
  try {
    const resp = await fetch(CLOUD_API + '/' + SYNC_DATA_FILE, {
      headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json' }
    });
    if (!resp.ok) { console.log('Cloud: no data file yet'); return; }
    const apiResp = await resp.json();
    if (!apiResp.content) { console.log('Cloud: empty content'); return; }
    // 解码外层（兼容新旧格式）
    let rawContent = atob(apiResp.content);
    let enc;
    try { enc = JSON.parse(rawContent); }
    catch (e) { console.log('Cloud: old format, try raw'); enc = apiResp; }
    if (!enc.iv || !enc.data) { console.log('Cloud: unreadable format'); return; }
    // 解密
    const json = await decryptData(enc.iv, enc.data);
    const cloudData = JSON.parse(json);
    const local = await dbGetAll('memories', 'byDate', 'prev');
    const localMap = new Map(local.map(m => [m.id, m]));
    stats.memories = cloudData.length;

    for (const cm of cloudData) {
      const localItem = localMap.get(cm.id);
      if (!localItem || (cm.createdAt && localItem.createdAt !== cm.createdAt)) {
        if (cm._hasImage && (!localItem || !localItem.fullImage)) {
          try {
            const imgResp = await fetch(CLOUD_API + '/photos/' + cm.id + '.enc', {
              headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json' }
            });
            if (imgResp.ok) {
              const imgApi = await imgResp.json();
              if (imgApi.content) {
                let imgEnc;
                try { imgEnc = JSON.parse(atob(imgApi.content)); }
                catch (e2) { imgEnc = imgApi; }
                if (imgEnc.iv && imgEnc.data) {
                  const blob = await decryptBlob(imgEnc.iv, imgEnc.data);
                  cm.fullImage = blob;
                  cm.thumbnail = await resizeBlob(blob, 300, 0.6);
                  stats.photos++;
                }
              }
            }
          } catch (e) { stats.failed++; console.log('Photo #' + cm.id + ' failed:', e.message); }
        }
        if (localItem && !cm.fullImage) {
          cm.fullImage = localItem.fullImage;
          cm.thumbnail = localItem.thumbnail;
        }
        await dbPut('memories', cm);
      }
    }
    updateSyncStatus();
    console.log('📥 同步完成:', stats.memories + '条记忆,' + stats.photos + '张照片,' + stats.failed + '个失败');
    if (stats.failed > 0) showToast('📥 ' + stats.memories + '条记忆, ' + stats.photos + '张照片 (' + stats.failed + '张需对方重新上传)', 'info');
  } catch (e) {
    console.log('Cloud sync error:', e.message);
    showToast('同步失败，请检查密钥和网络', 'error');
  }
}

// 调整图片尺寸（从Blob）
async function resizeBlob(blob, maxDim, quality) {
  const url = URL.createObjectURL(blob);
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        const ratio = Math.min(maxDim / w, maxDim / h);
        w = Math.round(w * ratio); h = Math.round(h * ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(b => { URL.revokeObjectURL(url); resolve(b); }, 'image/jpeg', quality);
    };
    img.onerror = reject;
    img.src = url;
  });
}

async function uploadToCloud(memory) {
  const token = getSyncToken();
  if (!token) return;
  try {
    let cloudData = [], sha = null;
    try {
      const r = await fetch(CLOUD_API + '/' + SYNC_DATA_FILE, {
        headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json' }
      });
      if (r.ok) {
        const apiResp = await r.json();
        // GitHub API 返回 { content: "base64...", sha: "..." }
        const rawContent = atob(apiResp.content);
        const enc = JSON.parse(rawContent);
        const json = await decryptData(enc.iv, enc.data);
        cloudData = JSON.parse(json);
        sha = apiResp.sha;
      }
    } catch (e) {}

    const clean = { ...memory };
    delete clean.thumbnail; delete clean.fullImage;
    clean._hasImage = !!memory.fullImage;

    const idx = cloudData.findIndex(m => m.id === clean.id);
    if (idx >= 0) cloudData[idx] = clean;
    else cloudData.push(clean);

    const json = JSON.stringify(cloudData);
    const enc = await encryptData(json);
    const body = {
      message: '💕 记忆 #' + memory.id,
      content: btoa(JSON.stringify(enc))
    };
    if (sha) body.sha = sha;

    await fetch(CLOUD_API + '/' + SYNC_DATA_FILE, {
      method: 'PUT', headers: {
        'Authorization': 'token ' + token,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      }, body: JSON.stringify(body)
    });

    // 🔒 加密照片后上传
    if (memory.fullImage && memory.fullImage instanceof Blob) {
      const encImg = await encryptBlob(memory.fullImage);
      let imgSha = null;
      const path = 'photos/' + memory.id + '.enc';
      try {
        const cr = await fetch(CLOUD_API + '/' + path, {
          headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json' }
        });
        if (cr.ok) { const ex = await cr.json(); imgSha = ex.sha; }
      } catch (ee) {}
      const ib = {
        message: '📸 照片 #' + memory.id,
        content: btoa(JSON.stringify(encImg))
      };
      if (imgSha) ib.sha = imgSha;
      await fetch(CLOUD_API + '/' + path, {
        method: 'PUT', headers: {
          'Authorization': 'token ' + token,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        }, body: JSON.stringify(ib)
      });
    }
    console.log('🔒 已加密同步到云端: #' + memory.id);
  } catch (e) { console.error('Sync err:', e); }
}

// 4. IndexedDB
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('memories')) {
        const store = db.createObjectStore('memories', { keyPath: 'id', autoIncrement: true });
        store.createIndex('byDate', 'date', { unique: false });
        store.createIndex('byType', 'type', { unique: false });
      }
      if (!db.objectStoreNames.contains('assets')) {
        db.createObjectStore('assets', { keyPath: 'key' });
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

function dbAdd(storeName, data) {
  return openDB().then(db => {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      const req = store.add(data);
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror = (e) => reject(e.target.error);
      tx.oncomplete = () => db.close();
    });
  });
}

function dbPut(storeName, data) {
  return openDB().then(db => {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      const req = store.put(data);
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror = (e) => reject(e.target.error);
      tx.oncomplete = () => db.close();
    });
  });
}

function dbGetAll(storeName, indexName, direction='prev') {
  return openDB().then(db => {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readonly');
      const store = tx.objectStore(storeName);
      const results = [];
      let cursorReq;
      if (indexName) {
        cursorReq = store.index(indexName).openCursor(null, direction);
      } else {
        cursorReq = store.openCursor(null, direction);
      }
      cursorReq.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          results.push(cursor.value);
          cursor.continue();
        } else {
          resolve(results);
        }
      };
      cursorReq.onerror = (e) => reject(e.target.error);
      tx.oncomplete = () => db.close();
    });
  });
}

function dbGet(storeName, key) {
  return openDB().then(db => {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readonly');
      const req = tx.objectStore(storeName).get(key);
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror = (e) => reject(e.target.error);
      tx.oncomplete = () => db.close();
    });
  });
}

function dbDelete(storeName, key) {
  return openDB().then(db => {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      const req = tx.objectStore(storeName).delete(key);
      req.onsuccess = () => resolve();
      req.onerror = (e) => reject(e.target.error);
      tx.oncomplete = () => db.close();
    });
  });
}

function dbClear(storeName) {
  return openDB().then(db => {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      const req = tx.objectStore(storeName).clear();
      req.onsuccess = () => resolve();
      req.onerror = (e) => reject(e.target.error);
      tx.oncomplete = () => db.close();
    });
  });
}

function resizeImage(file, maxDim, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          const ratio = Math.min(maxDim / w, maxDim / h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob((blob) => {
          resolve(blob);
        }, 'image/jpeg', quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  }

  // 冷却检查
  if (cooldownUntil && Date.now() < cooldownUntil) {
    const sec = Math.ceil((cooldownUntil - Date.now())/1000);
    lockError.textContent = `请等待 ${sec} 秒后再试`;
    return;
  }

  const hash = await hashPin(pinInput);

  if (isSettingPassword) {
    if (!pinConfirm) {
      pinConfirm = hash;
      pinInput = '';
      updatePinDots();
      lockSubtitle.textContent = '请再次输入密码确认';
      lockTitle.textContent = '确认密码';
      return;
    }
    if (hash === pinConfirm) {
      localStorage.setItem('passwordHash', hash);
      isSettingPassword = false;
      pinConfirm = '';
      showToast('密码设置成功！💕', 'success');
      unlockApp();
    } else {
      lockError.textContent = '两次密码不一致，请重新设置';
      pinConfirm = '';
      pinInput = '';
      updatePinDots();
      lockSubtitle.textContent = '设置一个6位数字密码来保护你们的回忆';
      lockTitle.textContent = '设置密码';
    }
    return;
  }

  const storedHash = localStorage.getItem('passwordHash');
  if (hash === storedHash) {
    failedAttempts = 0;
    unlockApp();
  } else {
    failedAttempts++;
    pinInput = '';
    updatePinDots();
    $$('.pin-dot').forEach(d => d.classList.add('error'));
    setTimeout(() => $$('.pin-dot').forEach(d => d.classList.remove('error')), 600);
    lockError.textContent = `密码错误 (${failedAttempts}/5)`;
    if (failedAttempts >= 5) {
      cooldownUntil = Date.now() + 30000;
      lockError.textContent = '错误次数过多，请等待30秒';
      setTimeout(() => { lockError.textContent = ''; }, 30000);
    }
  }
}

function unlockApp() {
  lockScreen.classList.add('hidden');
  appContainer.style.display = 'flex';
  forgotLink.style.display = 'none';
  pinInput = '';
  updatePinDots();
  // 触发用户交互以允许音频播放

let currentMode = 'photo';
let editingMemoryId = null;

async function saveMemory() {
  const date = $('#memoryDate').value;
  const title = $('#memoryTitle').value.trim();
  const saveBtn = $('#saveMemoryBtn');

  if (!date) { showToast('请选择日期 📅', 'error'); return; }
  if (!title) { showToast('请输入标题 💬', 'error'); return; }

  saveBtn.disabled = true;
  saveBtn.textContent = '⏳ 保存中...';

  let savedMemory = null;
  try {
    if (currentMode === 'photo') {
      if (editingMemoryId) {
        const mem = await dbGet('memories', editingMemoryId);
        mem.date = date;
        mem.title = title;
        await dbPut('memories', mem);
        savedMemory = mem;
      } else {
        if (!pendingPhotoBlob) { showToast('请选择一张照片 📷', 'error'); saveBtn.disabled = false; saveBtn.textContent = '💾 保存回忆'; return; }
        const newId = await dbAdd('memories', {
          type: 'photo',
          date: date,
          title: title,
          content: '',
          thumbnail: pendingThumbBlob,
          fullImage: pendingPhotoBlob,
          imageFileName: pendingPhotoFile ? pendingPhotoFile.name : 'photo.jpg',
          createdAt: new Date().toISOString()
        });
        savedMemory = await dbGet('memories', newId);
      }
      resetPhotoUpload();
    } else {
      const content = $('#journalContent').value.trim();
      if (!content) { showToast('请写下日记内容 📝', 'error'); saveBtn.disabled = false; saveBtn.textContent = '💾 保存回忆'; return; }
      if (editingMemoryId) {
        const mem = await dbGet('memories', editingMemoryId);
        mem.date = date;
        mem.title = title;
        mem.content = content;
        await dbPut('memories', mem);
        savedMemory = mem;
      } else {
        const newId = await dbAdd('memories', {
          type: 'journal',
          date: date,
          title: title,
          content: content,
          thumbnail: null,
          fullImage: null,
          createdAt: new Date().toISOString()
        });
        savedMemory = await dbGet('memories', newId);
      }
      $('#journalContent').value = '';
    }

    editingMemoryId = null;
    $('#memoryTitle').value = '';
    heartBurst(window.innerWidth/2, window.innerHeight/2);
    showToast('回忆保存成功！💕', 'success');
    saveBtn.textContent = '💾 保存回忆';

    // 刷新
    await loadTimeline();
    loadJournals();
    // 云端同步：直接上传刚保存的记忆对象，不重新查询
    if (syncEnabled() && savedMemory) {
      uploadToCloud(savedMemory);
    }
  } catch (err) {
    if (err.name === 'QuotaExceededError') {
      showToast('存储空间不足，请删除一些旧照片', 'error');
    } else {
      showToast('保存失败：' + err.message, 'error');
    }
    console.error(err);
    saveBtn.textContent = '💾 保存回忆';
  }
  saveBtn.disabled = false;
}

let allMemories = [];
let displayedCount = 0;

async function loadTimeline() {
  try {
    // 先尝试云端同步
    if (syncEnabled()) { await syncFromCloud(); }
    allMemories = await dbGetAll('memories', 'byDate', 'prev');
    displayedCount = 0;
    const container = $('#timelineContainer');
    if (container) container.innerHTML = '';
    renderTimelineBatch();
  } catch (err) {
    console.error('加载时间轴失败:', err);
  }
}

function renderTimelineBatch() {
  const container = $('#timelineContainer');
  const empty = $('#timelineEmpty');

  if (allMemories.length === 0) {
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  const batch = allMemories.slice(displayedCount, displayedCount + ITEMS_PER_PAGE);
  batch.forEach((mem, i) => {
    const card = createMemoryCard(mem, displayedCount + i);
    container.appendChild(card);
  });
  displayedCount += batch.length;
}

function createMemoryCard(mem, index) {
  const card = document.createElement('div');
  card.className = 'memory-card';
  card.style.animationDelay = (Math.min(index, 10) * 0.05) + 's';
  card.onclick = () => showDetail(mem);

  const typeLabel = mem.type === 'photo' ? '📷 照片' : '📝 日记';
  let inner = `
    <div class="card-date">
      <span class="card-type-badge">${typeLabel}</span>
      ${formatDate(mem.date)}
    </div>`;

  if (mem.type === 'photo' && mem.thumbnail) {
    const url = URL.createObjectURL(mem.thumbnail);
    card._thumbUrl = url;
    inner += `<img class="card-thumb" src="${url}" alt="" loading="lazy">`;
  } else if (mem.type === 'journal') {
    inner += `<div style="font-size:32px;margin-bottom:8px">💌</div>`;
  }

  inner += `
    <div class="card-title">${escapeHtml(mem.title)}</div>
    <div class="card-preview">${escapeHtml(mem.content || '')}</div>`;

  card.innerHTML = inner;
  return card;
}

function showDetail(mem) {
  currentDetailId = mem.id;
  $('#modalImg').style.display = 'none';
  $('#modalBody').textContent = '';

  if (mem.type === 'photo' && mem.fullImage) {
    const url = URL.createObjectURL(mem.fullImage);
    $('#modalImg').src = url;
    $('#modalImg').style.display = '';
    $('#modalImg')._imgUrl = url;
  }

  $('#modalDate').textContent = formatDate(mem.date);
  $('#modalTitle').textContent = mem.title;
  if (mem.content) {
    $('#modalBody').textContent = mem.content;
  }
  $('#modalEditBtn').onclick = () => editMemory(mem);
  $('#modalDeleteBtn').onclick = () => deleteMemory(mem.id);
  $('#detailModal').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeDetail(e) {
  if (e && e.target !== e.currentTarget) return;
  $('#detailModal').style.display = 'none';
  document.body.style.overflow = '';
  // 清理URL
  if ($('#modalImg')._imgUrl) {
    URL.revokeObjectURL($('#modalImg')._imgUrl);
    $('#modalImg')._imgUrl = null;
  }
  currentDetailId = null;
}

async function deleteMemory(id) {
  if (!confirm('确定要删除这条回忆吗？')) return;
  try {
    await dbDelete('memories', id || currentDetailId);
    showToast('回忆已删除', 'info');
    closeDetail();
    refreshAll();
  } catch (err) {
    showToast('删除失败', 'error');
  }
}

function editMemory(mem) {
  closeDetail();
  switchView('viewAddMemory');
  editingMemoryId = mem ? mem.id : currentDetailId;
  const targetMem = mem || allMemories.find(m => m.id === currentDetailId);
  if (!targetMem) return;

  if (targetMem.type === 'photo') {
    setMode('photo');
    resetPhotoUpload();
  } else {
    setMode('journal');
    $('#journalContent').value = targetMem.content || '';
  }
  $('#memoryDate').value = targetMem.date || '';
  $('#memoryTitle').value = targetMem.title || '';
  $('#saveMemoryBtn').textContent = '✏️ 更新回忆';
}

async function loadJournals() {
  const journals = allMemories.filter(m => m.type === 'journal');

function renderJournalList(journals) {
  const container = $('#journalContainer');
  const empty = $('#journalEmpty');

    ? journals.filter(j =>

  filtered.forEach((mem, i) => {

function updateAnniversary() {
  const date = $('#anniversaryInput').value;
  if (date) {
    localStorage.setItem('anniversaryDate', date);
  } else {
    localStorage.removeItem('anniversaryDate');
  }
  updateAnniversaryBanner();
  updateSettingsAnniversaryInfo();
}

function updateAnniversaryBanner() {
  const dateStr = localStorage.getItem('anniversaryDate');
  const banner = $('#anniversaryBanner');
  if (!dateStr) {
    banner.style.display = 'none';
    return;
  }
  banner.style.display = '';
  const days = daysBetween(dateStr, new Date().toISOString().split('T')[0]);
  const countEl = $('#daysCount');
  // 数字动画
  animateNumber(countEl, days);

  // 下一个里程碑
  const startDate = new Date(dateStr);
  const today = new Date();
  let nextMilestone = null;
  let milestoneLabel = '';
  const milestones = [100, 200, 300, 365, 500, 666, 730, 888, 1000, 1314, 1500, 2000, 3000, 3650, 5000, 9999];
  for (const m of milestones) {
    const targetDate = new Date(startDate.getTime() + m * 86400000);
    if (targetDate > today) {
      nextMilestone = targetDate;
      milestoneLabel = m + '天';
      break;
    }
  }
  if (nextMilestone) {
    const remaining = daysBetween(today.toISOString().split('T')[0], nextMilestone.toISOString().split('T')[0]);
    $('#nextMilestone').textContent = `🎯 距离 ${milestoneLabel} 纪念日还有 ${remaining} 天 (${formatDateShort(nextMilestone.toISOString().split('T')[0])})`;
  } else {
    $('#nextMilestone').textContent = '💕 每一个今天都是纪念日';
  }
}

function updateSettingsAnniversaryInfo() {
  const dateStr = localStorage.getItem('anniversaryDate');
  const info = $('#settingsAnniversaryInfo');
  if (dateStr) {
    const days = daysBetween(dateStr, new Date().toISOString().split('T')[0]);
    info.textContent = `💝 已经在一起 ${days} 天啦！`;
  } else {
    info.textContent = '';
  }
}

function animateNumber(el, target) {
  const start = parseInt(el.textContent) || 0;
  if (start === target) { el.textContent = target; return; }
  const duration = 800;
  const startTime = performance.now();
  function step(now) {
    const progress = Math.min((now - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3); // ease-out
    el.textContent = Math.round(start + (target - start) * eased);
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function applyBackground() {
  const bgType = localStorage.getItem('bgType') || 'preset';
  if (bgType === 'custom') {
    dbGet('assets', 'bgCustom').then(asset => {
      if (asset && asset.value) {
        const url = URL.createObjectURL(asset.value);
        document.body.style.backgroundImage = `url(${url})`;
        document.body._bgUrl = url;
      } else {
        applyPresetBg();
      }
    }).catch(() => applyPresetBg());
  } else {
    applyPresetBg();
  }
}

function applyPresetBg() {
  const presetId = localStorage.getItem('bgPresetId') || 'gradient-rose';
  document.body.style.backgroundImage = PRESETS[presetId] || PRESETS['gradient-rose'];
}

function handleBgUpload(input) {
  const file = input.files[0];
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    const img = new Image();
    img.onload = async () => {
      let w = img.width, h = img.height;
      if (w > 1920) { h = Math.round(h * 1920 / w); w = 1920; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8));
      await dbPut('assets', { key: 'bgCustom', value: blob, updatedAt: new Date().toISOString() });
      localStorage.setItem('bgType', 'custom');
      applyBackground();
      $('#resetBgBtn').disabled = false;
      showToast('自定义背景已应用！🎨', 'success');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function resetBackground() {
  localStorage.setItem('bgType', 'preset');
  applyBackground();
  $('#resetBgBtn').disabled = true;
  showToast('已恢复默认背景', 'info');
}

function renderPresetPicker() {
  const grid = $('#presetGrid');
  const currentPreset = localStorage.getItem('bgPresetId') || 'gradient-rose';
  const bgType = localStorage.getItem('bgType') || 'preset';
  grid.innerHTML = '';

  Object.entries(PRESETS).forEach(([key, css]) => {
    const item = document.createElement('div');
    item.className = 'preset-item';
    if (bgType === 'preset' && key === currentPreset) item.classList.add('selected');
    item.style.background = css.replace('radial-gradient', 'linear-gradient').replace(/ellipse[^,]+,/g, '135deg,');
    // 简化渐变展示
    const colors = css.match(/#[0-9a-fA-F]{6}/g) || ['#ff6b81','#0a0a12'];
    item.style.background = `linear-gradient(135deg, ${colors[0] || '#ff6b81'}, ${colors[1] || '#0a0a12'})`;
    item.title = key;
    item.onclick = () => {
      localStorage.setItem('bgType', 'preset');
      localStorage.setItem('bgPresetId', key);
      $('#resetBgBtn').disabled = true;
      applyBackground();
      renderPresetPicker();
      showToast('背景已切换 ✨', 'success');
    };
    grid.appendChild(item);
  });

  if (bgType === 'custom') $('#resetBgBtn').disabled = false;
}

async function handleMusicUpload(input) {
  const file = input.files[0];
  if (!file || !file.type.startsWith('audio/')) return;
  try {
    await dbPut('assets', { key: 'bgm', value: file, updatedAt: new Date().toISOString() });
    localStorage.setItem('bgmFileName', file.name);
    $('#musicName').textContent = file.name;
    loadMusicFromDB();
    showToast('音乐上传成功！🎵', 'success');
  } catch (err) {
    showToast('音乐上传失败', 'error');
  }
}

async function loadMusicFromDB() {
  try {
    const asset = await dbGet('assets', 'bgm');
    if (asset && asset.value) {
      const url = URL.createObjectURL(asset.value);
      if (bgmAudio._musicUrl) URL.revokeObjectURL(bgmAudio._musicUrl);
      bgmAudio.src = url;
      bgmAudio._musicUrl = url;
      bgmAudio.volume = parseFloat(localStorage.getItem('bgmVolume') || '0.5');
      bgmAudio.loop = localStorage.getItem('bgmLoop') !== 'false';
      musicFAB.style.display = '';
      $('#musicToggleBtn').style.display = '';
      $('#musicName').textContent = localStorage.getItem('bgmFileName') || '已上传';
      updateMusicUI();
    }
  } catch (err) {
    // 没有音乐文件，正常
  }
}

function toggleMusic() {
  if (!bgmAudio.src || bgmAudio.src === window.location.href) {
    showToast('请先上传音乐 🎶', 'info');
    return;
  }
  if (bgmAudio.paused) {
    bgmAudio.play().then(() => {
      localStorage.setItem('bgmEnabled', 'true');
      updateMusicUI();
    }).catch(() => showToast('播放失败，请点击按钮播放', 'error'));
  } else {
    bgmAudio.pause();
    localStorage.setItem('bgmEnabled', 'false');
    updateMusicUI();
  }
}

function updateMusicUI() {
  const playing = !bgmAudio.paused;
  musicFAB.classList.toggle('playing', playing);
  musicFAB.textContent = playing ? '🎵' : '🔇';
  $('#musicToggleBtn').textContent = playing ? '⏸️ 暂停音乐' : '▶️ 播放音乐';
}

function setVolume(val) {
  const vol = val / 100;
  bgmAudio.volume = vol;
  localStorage.setItem('bgmVolume', String(vol));
}

function toggleLoop(checked) {
  bgmAudio.loop = checked;
  localStorage.setItem('bgmLoop', String(checked));
}

async function deleteAllData() {

  if (!confirm('包括所有照片、日记、设置，此操作不可撤销！')) return;
  if (!confirm('最后一次确认：真的要删除一切吗？')) return;
  try {
    await dbClear('memories');
    await dbClear('assets');
    showToast('所有数据已删除', 'info');
    refreshAll();
  } catch (err) {
    showToast('删除失败', 'error');
  }
}

// ══════════════════════════════════════════════════════════════
// 17. 爱心飘落动画 Canvas
// ══════════════════════════════════════════════════════════════
let hearts = [];
let heartsAnimationId = null;
const MAX_HEARTS = window.innerWidth < 768 ? 30 : 50;

function initHeartsCanvas() {
  if (!heartsCtx) return; // canvas not found, skip animation
  resizeHeartsCanvas();
  window.addEventListener('resize', resizeHeartsCanvas);
  if (!heartsAnimationId) {
    heartsAnimationId = requestAnimationFrame(heartsLoop);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      cancelAnimationFrame(heartsAnimationId);
      heartsAnimationId = null;
    } else if (!heartsAnimationId) {
      heartsAnimationId = requestAnimationFrame(heartsLoop);
    }
  });
}

function resizeHeartsCanvas() {
  if (!heartsCanvas || !heartsCtx) return;
  const dpr = window.devicePixelRatio || 1;
  heartsCanvas.width = window.innerWidth * dpr;
  heartsCanvas.height = window.innerHeight * dpr;
  heartsCtx.setTransform(1, 0, 0, 1, 0, 0);
  heartsCtx.scale(dpr, dpr);
}

function spawnHeart() {
  if (hearts.length >= MAX_HEARTS) return;
  const theme = localStorage.getItem('theme') || '';
  const colors = {
    '': ['#ff6b81', '#ffb8c6', '#ff8fa3'],
    'blush': ['#f8a4c8', '#fcd5e4', '#ffb8d0'],
    'lavender': ['#c3cfe2', '#d4c5e2', '#b8a9c9'],
    'sunset': ['#ff9a76', '#ffc3a0', '#ffb088'],
  };
  const palette = colors[theme] || colors[''];
  hearts.push({
    x: Math.random() * window.innerWidth,
    y: -30,
    size: 14 + Math.random() * 28,
    speed: 0.4 + Math.random() * 1.6,
    opacity: 0.25 + Math.random() * 0.6,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.02,
    color: palette[Math.floor(Math.random() * palette.length)],
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 0.01 + Math.random() * 0.03,
    wobbleAmp: 0.3 + Math.random() * 1.5,
  });
}

function heartsLoop(timestamp) {
  if (!heartsCtx) return;
  if (document.hidden) {
    heartsAnimationId = requestAnimationFrame(heartsLoop);
    return;
  }

  const W = window.innerWidth;
  const H = window.innerHeight;

  heartsCtx.clearRect(0, 0, W, H);

  // 每帧生成1-3颗爱心
  const spawnRate = MAX_HEARTS / 40;
  for (let i = 0; i < spawnRate; i++) spawnHeart();

  hearts = hearts.filter(h => {
    h.y += h.speed;
    h.rotation += h.rotSpeed;
    h.wobble += h.wobbleSpeed;
    h.x += Math.sin(h.wobble) * h.wobbleAmp * 0.3;

    if (h.y > H + 50) return false;

    heartsCtx.save();
    heartsCtx.globalAlpha = h.opacity;
    heartsCtx.translate(h.x, h.y);
    heartsCtx.rotate(h.rotation);
    heartsCtx.font = `${h.size}px serif`;
    heartsCtx.fillStyle = h.color;
    heartsCtx.textAlign = 'center';
    heartsCtx.textBaseline = 'middle';
    heartsCtx.fillText('♥', 0, 0);
    heartsCtx.restore();

    return true;
  });

  heartsAnimationId = requestAnimationFrame(heartsLoop);
}

// ══════════════════════════════════════════════════════════════
// 18. 视图导航
// ══════════════════════════════════════════════════════════════
function switchView(viewId) {
  $$('.view').forEach(v => v.classList.remove('active'));
  const target = $('#' + viewId);
  if (target) target.classList.add('active');

  $$('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.view === viewId);
  });

  // 加载对应视图数据
  if (viewId === 'viewTimeline') refreshAll();
  if (viewId === 'viewJournal') loadJournals();
  if (viewId === 'viewSettings') {
    renderPresetPicker();
    updateSettingsAnniversaryInfo();
    updateThemeDots();
  }
  if (viewId === 'viewAddMemory') {
    if (!editingMemoryId) {
      resetPhotoUpload();
      $('#journalContent').value = '';
      $('#memoryTitle').value = '';
      $('#memoryDate').value = new Date().toISOString().split('T')[0];
      $('#saveMemoryBtn').textContent = '💾 保存回忆';
    }
  }

  // 滚动到顶部
  const viewEl = $('#' + viewId);
  if (viewEl) viewEl.scrollTop = 0;
}

function setMode(mode) {
  currentMode = mode;
  $$('.segment-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  $('#photoMode').style.display = mode === 'photo' ? '' : 'none';
  $('#journalMode').style.display = mode === 'journal' ? '' : 'none';
}

async function refreshAll() {
  await loadTimeline();
  loadJournals();
  updateAnniversaryBanner();
}

function updateThemeDots() {
  const current = localStorage.getItem('theme') || '';
  $$('.theme-dot').forEach(d => {
    d.classList.toggle('selected', d.dataset.themeVal === current);
  });
}

// 20. 键盘事件
// ══════════════════════════════════════════════════════════════
document.addEventListener('keydown', (e) => {
  // 弹窗关闭
  if (e.key === 'Escape' && $('#detailModal').style.display === 'flex') {
    closeDetail();
  }
  // 锁屏时键盘输入
  if (lockScreen.classList.contains('hidden')) return;
  if (e.key >= '0' && e.key <= '9') {
    if (pinInput.length < PIN_LENGTH) {
      pinInput += e.key;
      updatePinDots();
      if (pinInput.length === PIN_LENGTH) submitPin();
    }
  } else if (e.key === 'Backspace' || e.key === 'Delete') {
    pinInput = pinInput.slice(0, -1);
    updatePinDots();
  } else if (e.key === 'Enter') {
    submitPin();
  }
});

// ══════════════════════════════════════════════════════════════
// 21. 事件委托
// ══════════════════════════════════════════════════════════════

// 键盘输入函数 - 通过 onclick 调用，手机/电脑都可靠
function pinPress(key) {
  if (key === 'clear') { clearPin(); return; }
  if (key === 'ok') { submitPin(); return; }
  if (pinInput.length < PIN_LENGTH) {
    pinInput += key;
    updatePinDots();
    if (pinInput.length === PIN_LENGTH) submitPin();
  }
}
window.pinPress = pinPress;

// Tab切换
$('#tabBar').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  switchView(btn.dataset.view);
});

// 添加模式切换
document.addEventListener('click', (e) => {
  const seg = e.target.closest('.segment-btn');
  if (!seg) return;
  setMode(seg.dataset.mode);
});

// 加载更多
const sentinel = $('#loadMoreSentinel');
if (sentinel) loadMoreObserver.observe(sentinel);

// 22. 应用初始化
// ══════════════════════════════════════════════════════════════
async function init() {
  // 初始化IndexedDB
  try { await openDB(); } catch (err) { console.error('DB init error:', err); }

  // 应用背景
  applyBackground();

  // 应用主题
  const savedTheme = localStorage.getItem('theme') || '';
  if (savedTheme) {
    document.documentElement.setAttribute('data-theme', savedTheme);
  }
  updateThemeDots();

  // 更新纪念日设置页
  const annDate = localStorage.getItem('anniversaryDate');
  if (annDate) {
    $('#anniversaryInput').value = annDate;
    updateSettingsAnniversaryInfo();
  }

  // 加载音乐
  await loadMusicFromDB();

  // 初始化音量滑块
  const vol = parseFloat(localStorage.getItem('bgmVolume') || '0.5');
  $('#volumeSlider').value = vol * 100;
  bgmAudio.volume = vol;
  $('#loopCheckbox').checked = localStorage.getItem('bgmLoop') !== 'false';
  bgmAudio.loop = $('#loopCheckbox').checked;

  // 检查是否需要设置密码
  const passwordHash = localStorage.getItem('passwordHash');
  if (!passwordHash) {
    // 首次使用 - 设置密码
    isSettingPassword = true;
    lockTitle.textContent = '设置密码';
    lockSubtitle.textContent = '设置一个6位数字密码来保护你们的回忆';
    forgotLink.style.display = 'none';
  } else {
    isSettingPassword = false;
    lockTitle.textContent = 'Love Memory';
    lockSubtitle.textContent = '输入密码解锁你的回忆';
    forgotLink.style.display = '';
  }

  // 默认日期设为今天
  $('#memoryDate').value = new Date().toISOString().split('T')[0];

  // 锁屏状态
  lockScreen.classList.remove('hidden');
  appContainer.style.display = 'none';
  clearPin();

  // 监听bgm事件更新UI
  bgmAudio.addEventListener('play', updateMusicUI);
  bgmAudio.addEventListener('pause', updateMusicUI);
  bgmAudio.addEventListener('ended', () => {
    localStorage.setItem('bgmEnabled', 'false');
    updateMusicUI();
  });

  // 初始渲染预设选择器
  renderPresetPicker();

  console.log('💕 Love Memory 已就绪');
  console.log('  - 密码保护：' + (passwordHash ? '已设置' : '首次使用，请设置密码'));
  console.log('  - 纪念日：' + (annDate || '未设置，请在设置中配置'));
  console.log('  - ☁️ 云同步：' + (getSyncToken() ? '已激活' : '请在设置中配置密钥'));
  updateSyncStatus();
  // 自动从云端同步
  if (syncEnabled()) { syncFromCloud().then(() => loadTimeline()); }
}

  const token = getSyncToken();
  if (!token) { showToast('请先激活云同步', 'info'); return; }
  showToast('📥 正在从云端下载...', 'info');
  try {
    await syncFromCloud();
    await refreshAll();
    showToast('✅ 下载完成！', 'success');
  } catch (e) {
    showToast('下载失败: ' + e.message, 'error');
  }
}
window.setupSync = setupSync;
window.syncNow = syncNow;
window.pullFromCloud = pullFromCloud;
window.resetCloud = resetCloud;
window.resetApp = resetApp;

// ── 清除旧的 Service Worker（之前版本可能导致缓存问题）──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => { r.unregister(); console.log('🗑️ 旧SW已清除'); });
  });
}

// 启动应用
init();

})();
